    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <style>
      :root {
        --bg: #eef2fb;
        --surface: #ffffff;
        --primary: #4f6df5;
        --primary-dark: #3b52c4;
        --text: #1f2430;
        --text-muted: #6b7280;
        --border: #e6e9f2;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.1);
        --radius-lg: 16px;
        --radius-md: 10px;
      }

      * {
        box-sizing: border-box;

      body {

        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Pretendard',
          'Apple SD Gothic Neo',
          'Segoe UI',
          Roboto,
          sans-serif;
