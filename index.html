<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <style>
      :root {
        --bg: #eef2fb;
        --surface: #ffffff;
        --surface-glass: rgba(255, 255, 255, 0.75);
        --primary: #6d5ef5;
        --primary-dark: #4f3fd6;
        --gradient-primary: linear-gradient(135deg, #6d5ef5 0%, #ec4899 100%);
        --gradient-warm: linear-gradient(135deg, #fb923c 0%, #ef4444 100%);
        --gradient-cool: linear-gradient(135deg, #22d3ee 0%, #6366f1 100%);
        --gradient-cloud: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
        --text: #1f2430;
        --text-muted: #6b7280;
        --border: #e6e9f2;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.1);
        --shadow-glow: 0 12px 32px rgba(109, 94, 245, 0.22);
        --radius-lg: 18px;
        --radius-md: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 8% -10%, rgba(236, 72, 153, 0.16) 0%, transparent 45%),
          radial-gradient(circle at 95% 5%, rgba(34, 211, 238, 0.18) 0%, transparent 45%),
          radial-gradient(circle at 50% 100%, rgba(109, 94, 245, 0.14) 0%, transparent 55%),
          var(--bg);
        background-attachment: fixed;
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Pretendard',
          'Apple SD Gothic Neo',
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="app">

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
