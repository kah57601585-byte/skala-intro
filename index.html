<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <style>
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface-glass: rgba(26, 29, 39, 0.75);
        --hover-surface: rgba(139, 124, 246, 0.14);
        --primary: #8b7cf6;
        --primary-dark: #6d5ef5;
        --gradient-primary: linear-gradient(135deg, #8b7cf6 0%, #f472b6 100%);
        --gradient-warm: linear-gradient(135deg, #fb923c 0%, #f87171 100%);
        --gradient-cool: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        --gradient-cloud: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
        --text: #e8e9f3;
        --text-muted: #9ba1b4;
        --border: #2a2e3d;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 14px 32px rgba(0, 0, 0, 0.5);
        --shadow-glow: 0 14px 34px rgba(139, 124, 246, 0.35);
        --radius-lg: 18px;
        --radius-md: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 8% -10%, rgba(244, 114, 182, 0.14) 0%, transparent 45%),
          radial-gradient(circle at 95% 5%, rgba(56, 189, 248, 0.14) 0%, transparent 45%),
          radial-gradient(circle at 50% 100%, rgba(139, 124, 246, 0.16) 0%, transparent 55%),
          var(--bg);
        background-attachment: fixed;
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Pretendard',
          'Apple SD Gothic Neo',
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--primary);
      }
    </style>
  </head>
  <body>
    <div id="app">

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
